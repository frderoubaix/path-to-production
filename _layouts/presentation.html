<!DOCTYPE html>
<html>
<head>
  {% include head.html %}
</head>
<body>
  <div class="logo left-bottom">
    <img src="https://positivetech.adeo.com/wp-content/themes/adeo/dist/imgs/logo.svg">
    <img src="hhttps://logo-marque.com/wp-content/uploads/2022/04/Leroy-Merlin-Logo.png">
    <img src="https://upload.wikimedia.org/wikipedia/fr/7/72/2560px-Insa-hautsdefrance-logo.png">
  </div>
  {% assign page_name = page.name | split:'.' | first %}
  <div class="reveal">
    <div class='footer' style="position: absolute; bottom: 1em; left: 1em; font-size: 0.5em;">
      {{page.footer}}
    </div>
		<div class="slides">
      {% for post in site.categories[page_name] reversed %}
        {% include slide_md.html post=page %}
      {% endfor %}
		</div>
	</div>
	{% include script.html %}
</body>
</html>
